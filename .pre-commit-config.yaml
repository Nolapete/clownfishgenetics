repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.5 # Use the latest version
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pycqa/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        name: bandit
        exclude: ^tests/
        args:
          - -r

  - repo: https://github.com/Riverside-Healthcare/djLint
    rev: v1.36.4
    hooks:
      - id: djlint-reformat-django

  - repo: local
    hooks:
      - id: genetics-tests
        name: Genetics Unit Tests
        entry: pytest genetics_manager/tests/ -v --tb=short --maxfail=1 --no-header --no-summary
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.9.9
    hooks:
      - id: pip-compile
        name: Compile requirements.txt from pyproject.toml
        args: [
            "pyproject.toml",
            "--output-file",
            "requirements.txt",
            "--no-reuse-hashes", # Omit hashes as requested
            "--quiet",
          ]
        files: ^pyproject\.toml$
